<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Car Price Predictor</title>
  </head>
  <body>
    <div class="container py-5">
      <div class="card shadow">
        <div class="card-header text-center">
          <h2>Car Price Predictor</h2>
          <p class="mb-0">Professional vehicle valuation form</p>
        </div>
        <div class="card-body">
          <form method="post">
            <div class="form-group">
              <label>Company</label>
              <select class="form-control" name="company" required>
                {% for item in companies %}
                <option value="{{ item }}">{{ item }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="form-group">
              <label>Car Model</label>
              <select class="form-control" name="car_model" required>
                {% for item in car_models %}
                <option value="{{ item }}">{{ item }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="form-group">
              <label>Year</label>
              <select class="form-control" name="year" required>
                {% for item in years %}
                <option value="{{ item }}">{{ item }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="form-group">
              <label>Kilometers Driven</label>
              <input type="number" class="form-control" name="kms_driven" required min="0">
            </div>

            <div class="form-group">
              <label>Fuel Type</label>
              <select class="form-control" name="fuel_type" required>
                {% for item in fuel_types %}
                <option value="{{ item }}">{{ item }}</option>
                {% endfor %}
              </select>
            </div>

            <button type="submit" class="btn btn-primary">Predict Price</button>
          </form>

          {% if prediction is not none %}
          <div class="modal d-block" tabindex="-1" role="dialog" style="background: rgba(0,0,0,0.55);">
            <div class="modal-dialog modal-dialog-centered" role="document">
              <div class="modal-content popup-card">
                <div class="modal-body text-center p-4">
                  <div class="popup-icon">₹</div>
                  <h3 class="popup-title">Predicted Price</h3>
                  <p class="popup-price">₹{{ prediction }}</p>
                  <button type="button" class="btn btn-outline-primary mt-2" onclick="window.location.href='/'">Close</button>
                </div>
              </div>
            </div>
          </div>
          {% endif %}
        </div>
      </div>
    </div>
  </body>
</html>
